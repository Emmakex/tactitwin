name: TactiTwin Test Candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tactitwin-test-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-plugin tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test-*.php; do
            php "$test_file"
          done

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$s=file_get_contents("wordpress-plugin/tactitwin.php"); preg_match("/Version:\\s*([^\\r\\n]+)/", $s, $m); echo trim($m[1] ?? "");')"
          SCHEMA="$(php -r '$s=file_get_contents("wordpress-plugin/includes/class-tactitwin-db.php"); preg_match("/SCHEMA_VERSION\\s*=\\s*['\''\"]([^'\''\"]+)/", $s, $m); echo trim($m[1] ?? "");')"
          if [ -z "$VERSION" ] || [ -z "$SCHEMA" ]; then
            echo "Could not resolve plugin/schema version" >&2
            exit 1
          fi
          if [[ "$VERSION" == *dev* ]]; then
            echo "Test Candidate cannot be packaged with a -dev plugin version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"

      - name: Build installable WordPress ZIP
        shell: bash
        env:
          TACTITWIN_VERSION: ${{ steps.meta.outputs.version }}
          TACTITWIN_SCHEMA: ${{ steps.meta.outputs.schema }}
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/tactitwin
          cp -R wordpress-plugin/. build/tactitwin/
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' \
            'TactiTwin MVP Release Candidate' \
            "Version: ${TACTITWIN_VERSION}" \
            "Schema: ${TACTITWIN_SCHEMA}" \
            "Commit: ${GITHUB_SHA}" \
            "Built: ${BUILT_AT}" \
            > build/tactitwin/TEST-CANDIDATE.txt
          cat > build/tactitwin/BUILD-MANIFEST.json <<EOF
          {
            "name": "TactiTwin",
            "release_stage": "mvp-release-candidate",
            "plugin_version": "${TACTITWIN_VERSION}",
            "schema_version": "${TACTITWIN_SCHEMA}",
            "commit": "${GITHUB_SHA}",
            "built_at": "${BUILT_AT}",
            "minimum_php": "8.1"
          }
          EOF
          cd build
          zip -qr tactitwin-test-candidate.zip tactitwin
          sha256sum tactitwin-test-candidate.zip > SHA256SUMS.txt
          ZIP_SHA="$(cut -d' ' -f1 SHA256SUMS.txt)"
          cat > release-manifest.json <<EOF
          {
            "name": "TactiTwin",
            "release_stage": "mvp-release-candidate",
            "plugin_version": "${TACTITWIN_VERSION}",
            "schema_version": "${TACTITWIN_SCHEMA}",
            "commit": "${GITHUB_SHA}",
            "built_at": "${BUILT_AT}",
            "minimum_php": "8.1",
            "zip_sha256": "${ZIP_SHA}"
          }
          EOF
          unzip -l tactitwin-test-candidate.zip | grep -q 'tactitwin/tactitwin.php'
          unzip -l tactitwin-test-candidate.zip | grep -q 'tactitwin/includes/'
          unzip -l tactitwin-test-candidate.zip | grep -q 'tactitwin/BUILD-MANIFEST.json'

      - name: Upload Test Candidate
        uses: actions/upload-artifact@v4
        with:
          name: tactitwin-test-candidate-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            build/tactitwin-test-candidate.zip
            build/SHA256SUMS.txt
            build/release-manifest.json
          if-no-files-found: error
          retention-days: 14
