name: TactiTwin CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-plugin tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test-*.php; do
            php "$test_file"
          done
